# Canonical mappings for address abbreviations

abbreviations:
  # Street types
  "rd": "road"
  "rd.": "road"
  "st": "street"
  "st.": "street"
  "str": "street"
  "ave": "avenue"
  "ave.": "avenue"
  "av": "avenue"
  "blvd": "boulevard"
  "blvd.": "boulevard"
  "dr": "drive"
  "dr.": "drive"
  "ln": "lane"
  "ln.": "lane"
  "ct": "court"
  "ct.": "court"
  "pl": "place"
  "pl.": "place"
  "sq": "square"
  "sq.": "square"
  "pkwy": "parkway"
  "hwy": "highway"
  "wy": "way"

  # Unit / Sub-premise
  "apt": "apartment"
  "apt.": "apartment"
  "ste": "suite"
  "ste.": "suite"
  "fl": "floor"
  "fl.": "floor"
  "bldg": "building"
  "bldg.": "building"
  "rm": "room"
  "rm.": "room"
  "no": "number"
  "no.": "number"
  
  # Jurisdictions / Geography
  "twp": "TOWNSHIP_TOKEN"
  "twp.": "TOWNSHIP_TOKEN"
  "township": "TOWNSHIP_TOKEN"
  "dist": "district"
  "dist.": "district"
  "sec": "sector"
  "sec.": "sector"

  # Compass directions
  "n": "north"
  "n.": "north"
  "s": "south"
  "s.": "south"
  "e": "east"
  "e.": "east"
  "w": "west"
  "w.": "west"
  "ne": "northeast"
  "nw": "northwest"
  "se": "southeast"
  "sw": "southwest"

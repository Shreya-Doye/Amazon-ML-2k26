# Global Configuration for Amazon ML Challenge 2026 - Entity Resolution

seed: 42

paths:
  train_s1: "student_resource/dataset/train/train_source1.tsv"
  train_s2: "student_resource/dataset/train/train_source2.tsv"
  train_s3: "student_resource/dataset/train/train_source3.tsv"
  train_gt: "student_resource/dataset/train/train_ground_truth.tsv"
  
  test_s1: "student_resource/dataset/test/test_source1.tsv"
  test_s2: "student_resource/dataset/test/test_source2.tsv"
  test_s3: "student_resource/dataset/test/test_source3.tsv"
  
  val_split: "code/business_entity_resolution/configs/val_split_seed42.json"
  legal_suffixes: "code/business_entity_resolution/configs/legal_suffixes.yaml"
  address_abbreviations: "code/business_entity_resolution/configs/address_abbreviations.yaml"
  
  cache_dir: "code/business_entity_resolution/cache"
  model_dir: "code/business_entity_resolution/models_saved"
  output_dir: "output"
  
  candidate_pairs_tsv: "output/candidate_pairs.tsv"
  matching_results_tsv: "output/matching_results.tsv"

validation:
  val_ratio: 0.20
  stratify_by: ["country", "is_singleton"]

normalization:
  segmentation_min_token_len: 12
  custom_freq_dict_path: "code/business_entity_resolution/cache/vocab_freq.json"

blocking:
  df_cap_percentile: 0.995
  ngram_jaccard_threshold: 0.60
  ann_k: 20
  ann_nlist: 100
  embedding_model: "Qwen/Qwen3-Embedding-0.6B"
  embedding_batch_size: 32
  embedding_fallback_model: "BAAI/bge-m3"

models:
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    random_state: 42
    n_jobs: -1
    
  cross_encoder:
    model_name: "microsoft/mdeberta-v3-base"
    fallback_model_name: "distilbert-base-multilingual-cased"
    max_length: 256
    batch_size: 8
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-5
    num_train_epochs: 3
    fp16: true
    weight_decay: 0.01
    warmup_ratio: 0.1

ensemble:
  method: "weighted_average"  # or "stacking"
  weights:
    cross_encoder: 0.65
    lightgbm: 0.35

threshold:
  default_decision_threshold: 0.55
  beta: 0.5
